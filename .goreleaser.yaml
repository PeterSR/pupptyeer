# GoReleaser config for pupptyeer.
# Ships two static binaries from two modules:
#   pupptyeer      (root module, ./cmd/pupptyeer)  -> daemon + CLI
#   pupptyeer-mcp  (the mcp/ module, built with dir) -> MCP stdio/http front-end
# Validate locally with:  goreleaser check  &&  goreleaser release --snapshot --clean
version: 2

project_name: pupptyeer

before:
  hooks:
    - go mod download
    - go -C mcp mod download

builds:
  - id: pupptyeer
    main: ./cmd/pupptyeer
    binary: pupptyeer
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

  - id: pupptyeer-mcp
    # Build inside the separate mcp module; its replace directive resolves
    # ../clients/go from here.
    dir: mcp
    main: .
    binary: pupptyeer-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

# One archive per platform containing both binaries plus docs + license.
archives:
  - id: bundle
    ids: [pupptyeer, pupptyeer-mcp]
    name_template: "pupptyeer_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - PROTOCOL.md
      - LICENSE

# Image ghcr.io/petersr/pupptyeer. goreleaser puts the freshly built linux
# binaries in the build context at linux/<arch>/<binary> (the release assets
# are drafts/not yet downloadable while this runs) and keeps extra_files at
# their repo path. `latest` is only added for non-prerelease tags.
dockers_v2:
  - id: pupptyeer
    ids: [pupptyeer, pupptyeer-mcp]
    images:
      - ghcr.io/petersr/pupptyeer
    tags:
      - "{{ .Version }}"
      - '{{ if not .Prerelease }}latest{{ end }}'
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: docker/Dockerfile
    extra_files:
      - docker/pupptyeer-entrypoint.sh
    build_args:
      PUPPTYEER_VERSION: "{{ .Version }}"
      REVISION: "{{ .FullCommit }}"
    # The Dockerfile's labels sit in each platform's image config; ghcr reads a
    # multi-arch package's description from the index, which goreleaser
    # annotates (it adds the index: prefix when building several platforms).
    annotations:
      org.opencontainers.image.description: "pupptyeer daemon, CLI and MCP server (static binaries)"
      org.opencontainers.image.source: "https://github.com/PeterSR/pupptyeer"
      org.opencontainers.image.licenses: "MIT"

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: PeterSR
    name: pupptyeer
